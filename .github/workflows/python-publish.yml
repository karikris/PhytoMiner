name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -q
      - run: uv build
      - run: uv run --no-sync python scripts/check_wheel.py
      - run: uv run --no-sync python scripts/benchmark_dataset.py --rows 1000000
