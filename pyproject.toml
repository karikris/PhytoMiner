[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "phytominer"
dynamic = ["version"]
authors = [
  { name="Kris Kari", email="toffe.kari@gmail.com" }
]
description = "A Python library for efficiently fetching and processing gene homolog data from the Phytozome database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "polars>=2.1,<3",
    "duckdb>=2,<3",
    "pyarrow>=26,<27",
    "requests>=2.34.2,<3",
]

[project.urls]
"Homepage" = "https://github.com/karikris/PhytoMiner"
"Bug Tracker" = "https://github.com/karikris/PhytoMiner/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "build>=1.6,<2",
    "ruff==0.17.3",
    "pyright==1.1.414",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phytominer*"]

[tool.pytest.ini_options]
pythonpath = "."
[tool.setuptools.dynamic]
version = {attr = "phytominer.__version__"}

[tool.ruff]
target-version = "py315"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
"phytominer/workflows.py" = ["F401"] # Compatibility seams used by existing clients/tests.
[tool.pyright]
pythonVersion = "3.15"
include = ["phytominer", "examples"]
typeCheckingMode = "basic"
